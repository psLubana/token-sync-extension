<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; font-family: Segoe UI, sans-serif; font-size: 13px; padding: 10px; }
    label { font-weight: 600; display: block; margin-top: 8px; }
    select, button { width: 100%; margin-top: 4px; padding: 6px; }
    button { cursor: pointer; }
    #dst.current { color: #0a7d2c; font-weight: 600; }
    #dst option.current { color: #0a7d2c; font-weight: 600; }
    #status { margin-top: 10px; min-height: 18px; }
    .ok { color: #0a7d2c; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <label>Copy token from:</label>
  <select id="src"></select>

  <label>Paste token into:</label>
  <select id="dst"></select>

  <button id="go">Copy token to localhost tab</button>
  <button id="clip">Copy token to clipboard only</button>

  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
